# cargo-deny supply chain config (§52, SEC-002).
#
# `cargo deny check` runs licenses + advisories + bans. CI job: supply-chain.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "0BSD",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[[licenses.exceptions]]
name = "r-efi"
version = "6.0.0"
allow = ["LGPL-2.1-or-later"]

[bans]
# Transitive duplicate versions are common in application projects (e.g.
# cpufeatures via sha2/blake3, getrandom via ring/tempfile/uuid) and not a
# security risk. Warn so we notice, but don't block the gate.
multiple-versions = "warn"
# Workspace-inherited deps (`.workspace = true`) are flagged as wildcards;
# that's an intentional single-source-of-truth pattern, not a version `*`.
# Warn to catch genuine `version = "*"` without blocking workspace inheritance.
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
