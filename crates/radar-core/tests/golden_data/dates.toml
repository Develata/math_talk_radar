# Golden test data for the date parser (§8, M1).
# Schema:
#   id                — unique case identifier
#   input             — raw text fed to parse_date
#   expected_start    — ISO date "YYYY-MM-DD" or "null"
#   expected_end      — ISO date "YYYY-MM-DD" or "null"
#   expected_precision — year|month|day|date_time|range|unknown
#
# parse_date always returns Ok; unparseable text → Unknown precision, None
# start/end. No year inference (clock-free).

# --- Acceptance cases DATE-001..005 (explicitly identifiable) ---------------

[[cases]]
id = "DATE-001"
input = "3–7 August 2026"
expected_start = "2026-08-03"
expected_end = "2026-08-07"
expected_precision = "range"

[[cases]]
id = "DATE-001-hyphen"
input = "3-7 August 2026"
expected_start = "2026-08-03"
expected_end = "2026-08-07"
expected_precision = "range"

[[cases]]
id = "DATE-002"
input = "31 August – 4 September 2026"
expected_start = "2026-08-31"
expected_end = "2026-09-04"
expected_precision = "range"

[[cases]]
id = "DATE-002-hyphen"
input = "31 August - 4 September 2026"
expected_start = "2026-08-31"
expected_end = "2026-09-04"
expected_precision = "range"

[[cases]]
id = "DATE-003-range"
input = "August 3–7, 2026"
expected_start = "2026-08-03"
expected_end = "2026-08-07"
expected_precision = "range"

[[cases]]
id = "DATE-003-single"
input = "August 3, 2026"
expected_start = "2026-08-03"
expected_end = "null"
expected_precision = "day"

[[cases]]
id = "DATE-004"
input = "15–18 August 2026"
expected_start = "2026-08-15"
expected_end = "2026-08-18"
expected_precision = "range"

[[cases]]
id = "DATE-005-text"
input = "not a date at all"
expected_start = "null"
expected_end = "null"
expected_precision = "unknown"

[[cases]]
id = "DATE-005-yearless"
input = "3–7 August"
expected_start = "null"
expected_end = "null"
expected_precision = "unknown"

