# Golden test data for the ranking score composer (§26, M1).
#
# Schema:
#   id                    — unique case identifier (RANK-xxx for acceptance)
#   description           — human-readable description
#   topics                — list of topic_id strings
#   media                 — list of {type, access} inline tables
#   access_online         — livestream|hybrid|recording_expected|recording_available|no_online_access|unknown
#   source_tiers          — list of source_id strings (harness maps to tiers)
#   people                — list of {canonical, role, tags} inline tables
#   has_description       — bool
#   has_abstract          — bool
#   has_location          — bool
#   talk_count            — usize
#   interests             — optional inline map: topic_id → weight (f64)
#   expected_*            — expected component values
#   expected_total        — expected total score (f32)
#
# Per-signal caps: topic≤30, media≤25, access≤15, source_tier≤10, people≤10,
# completeness≤10.
#
# Source-tier map (fixed in harness):
#   "s-tier-src" → S (10), "a-tier-src" → A (7), "b-tier-src" → B (4),
#   "unknown-src" → Unknown (0).

