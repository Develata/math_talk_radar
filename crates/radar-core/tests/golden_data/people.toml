# Golden test data for the scholar matcher (§6, §6.1, §6.2, M1).
#
# Schema:
#   id                 — unique case identifier (PER-xxx for acceptance cases)
#   input              — text fed to match_scholars
#   context            — "structured_field_<role>" | "body_text" | "title_text"
#   expected_match     — true if expected_canonical should be in the hits
#   expected_canonical  — the scholar canonical name under test
#   expected_role      — snake_case role if expected_match (else omitted)
#   expected_confidence — confidence if expected_match (else omitted)
#   extra_scholars     — optional: inline scholar ids to add (e.g. ["benedict-gross"])
#   empty_scholars     — optional: if true, use an empty scholar list
#   expected_hit_count — optional: assert total hits == this number
#
# Role protection (§P-2, §6.2): body text yields at most TitleMention, never
# Speaker. Ambiguous surnames (li, wang, tao, yau, gross, wei, wu) in body text
# require ≥2 tokens of the canonical name to also appear.

# --- PER-001: scholar alias via StructuredField(Speaker) — all 10 seeded ------

