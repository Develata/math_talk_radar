# --- HTML-config (12) ---
#
# 11 sites have site-specific selectors tuned against their fixtures (§P-5):
#   mpim, cambridge-dpmms, oxford-math, ams-calendar, princeton-math, mit-math,
#   fields, ini, hcm, eth-math, icm.
# cirm is disabled: the homepage has no server-side event listing and the
#   WordPress RSS feed at /feed/ contains blog posts (buildings/venues), not
#   conferences. Revisit if CIRM publishes a real event feed.

