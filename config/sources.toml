# math_talk_radar runtime source config (§17).
#
# The authoritative audit registry — including pending_audit entries and
# per-source health — lives in docs/registry/source-registry.tsv and is
# validated by `cargo xtask check`. This file is the embedded default
# (CFG-001): the 15 audited, fixture-backed, enabled sources promoted after
# the M6 live audit. Disabled / dynamic_unsupported / audited-no-fixture
# sources remain in the registry TSV only.

# --- RSS (2) ---

[[sources]]
id = "clay"
name = "Clay Mathematics Institute"
tier = "a"
kind = "conference_series"
adapter = "rss"
entrypoint = "https://www.claymath.org/events/feed/"
allowed_hosts = ["www.claymath.org", "claymath.org"]
max_depth = 2
request_budget = 20
dynamic = false
enabled = true
fixture = "sites/clay-list.xml"

