# Scholar registry (§6.1). Decoupled from any parser. The matcher (M1) loads
# this and enforces the §6.2 ambiguity rules: short/ambiguous surnames (Li, Wang,
# Tao, Yau, Gross, ...) require a structured person field or strong
# name-in-context evidence; a title mention (e.g. "Gross-Zagier formula") never
# yields role `speaker`.
#
# M0 seeds a small accurate set of Fields/Abel/Wolf/Crafoord laureates. The full
# baseline coverage is expanded in M1/M6.

