name: Audit Source Export

on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-source-export.yml"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Archive exact source tree
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/math_talk_radar-source-${GITHUB_SHA}.tar.gz" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/math_talk_radar-source-${{ github.sha }}.tar.gz
          retention-days: 1
          if-no-files-found: error
