name: Live Smoke

# Advisory live-source health check (B5). Third-party outages must NOT fail CI
# (LIVE-003 is `advisory`). Runs on a schedule and on manual dispatch.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release

      - name: Live smoke (advisory)
        # `sources check` is the ADR-0009 stub (post-v0.1); `doctor` has no
        # network flag (CLI-25). Both are real local commands here. LIVE-003
        # keeps this advisory: non-zero exits are absorbed by
        # `continue-on-error: true` on the job.
        run: |
          ./target/release/math_talk_radar sources list > sources-list.txt || true
          ./target/release/math_talk_radar doctor --json > doctor.json || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-smoke-results
          path: |
            sources-list.txt
            doctor.json
