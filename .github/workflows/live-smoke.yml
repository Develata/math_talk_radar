name: Live Smoke

# Advisory live-source health check (B5). Third-party outages must NOT fail CI
# (LIVE-003 is `advisory`). Runs on a schedule and on manual dispatch.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Live smoke (advisory)
        # R3-P1-01: `cargo xtask live-smoke` runs the real fetch+adapter
        # pipeline against all enabled sources and reports per-source health
        # + success ratio. It hard-fails only on instrumentation breakage
        # (build failure, binary crash, unparseable output). Third-party
        # source failures are reflected in the ratio but never hard-fail.
        # LIVE-003 stays advisory: `continue-on-error: true` on the job
        # absorbs even instrumentation failures so a scheduled run never
        # blocks other workflows.
        run: cargo xtask live-smoke > live-smoke-report.txt 2>&1 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: live-smoke-results
          path: live-smoke-report.txt
