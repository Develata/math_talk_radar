name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'shadow' || 'full' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
