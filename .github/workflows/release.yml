name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + musl target
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Build static release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify static linkage
        run: |
          file target/x86_64-unknown-linux-musl/release/math_talk_radar
          ldd target/x86_64-unknown-linux-musl/release/math_talk_radar || true

      - name: Generate SHA-256 checksum
        run: |
          cd target/x86_64-unknown-linux-musl/release
          sha256sum math_talk_radar > math_talk_radar.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: math_talk_radar-musl
          path: |
            target/x86_64-unknown-linux-musl/release/math_talk_radar
            target/x86_64-unknown-linux-musl/release/math_talk_radar.sha256

  release:
    needs: build-musl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: math_talk_radar-musl
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/math_talk_radar
            release-assets/math_talk_radar.sha256
