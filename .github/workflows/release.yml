name: Release
'on':
  workflow_dispatch: null
  push:
    tags:
    - v*.*.*
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target/cargo
  RUSTFLAGS: -D warnings
jobs:
  acceptance:
    uses: ./.github/workflows/acceptance.yml
    with:
      profile: ${{ github.event_name == 'workflow_dispatch' && 'preflight' || 'release' }}
  attest:
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      receipt_sha: ${{ steps.pack.outputs.sha256 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/acceptance-control
      with:
        sha256: ${{ needs.acceptance.outputs.control_sha }}
        lane: release
        prepare-build: 'false'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: receipts-*
        merge-multiple: true
        path: target/acceptance/downloads
    - name: Reverify the complete pre-attestation gate
      env:
        RECEIPT_HASHES: ${{ needs.acceptance.outputs.receipt_hashes }}
      run: |
        python3 scripts/ci_artifacts.py receipts
        target/acceptance/control/xtask acceptance summarize --plan target/acceptance/control/plan.json --receipts target/acceptance/receipts --stage pre-attestation --out target/acceptance/pre-attestation.json
        target/acceptance/control/xtask acceptance verify-artifact --plan target/acceptance/control/plan.json --artifacts target/acceptance/receipts/build/artifacts
        gh attestation verify --help
    - uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
      with:
        subject-path: |-
          target/acceptance/receipts/build/artifacts/math_talk_radar-x86_64-unknown-linux-musl
          target/acceptance/receipts/build/artifacts/math_talk_radar-x86_64-unknown-linux-musl.sha256
      name: Attest the verified release assets
    - name: Verify attestation signer, source commit and exact subjects
      env:
        GH_TOKEN: ${{ github.token }}
      run: target/acceptance/control/xtask acceptance run --plan target/acceptance/control/plan.json --shard attestation
        --out target/acceptance/receipts --artifacts target/acceptance/receipts/build/artifacts
    - name: Verify final automated acceptance
      run: target/acceptance/control/xtask acceptance summarize --plan target/acceptance/control/plan.json
        --receipts target/acceptance/receipts --out target/acceptance/final-summary.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: final-acceptance-summary-${{ github.run_attempt }}
        path: target/acceptance/final-summary.json
        if-no-files-found: error
        retention-days: 30
      if: always()
    - id: pack
      if: always()
      run: python3 scripts/ci_artifacts.py pack --lane attestation --shards attestation
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: receipts-attestation
        path: target/acceptance/receipts-attestation.tar.gz
        if-no-files-found: error
        retention-days: 30
        overwrite: true
      if: always()
  release:
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
    - acceptance
    - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - name: Final dependency gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'CHECK'
        import json, os
        needs=json.loads(os.environ['NEEDS_JSON'])
        assert all(needs[name]['result']=='success' for name in ['acceptance','attest']), 'release prerequisites did not succeed'
        CHECK
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: ./.github/actions/acceptance-control
      with:
        sha256: ${{ needs.acceptance.outputs.control_sha }}
        lane: release
        prepare-build: 'false'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: receipts-*
        merge-multiple: true
        path: target/acceptance/downloads
    - id: hashes
      env:
        BASE_HASHES: ${{ needs.acceptance.outputs.receipt_hashes }}
        ATTESTATION_SHA: ${{ needs.attest.outputs.receipt_sha }}
      run: |
        python3 - <<'HASHES'
        import json, os
        hashes=json.loads(os.environ['BASE_HASHES'])
        hashes['attestation']=os.environ['ATTESTATION_SHA']
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            print('hashes='+json.dumps(hashes,separators=(',',':')), file=output)
        HASHES
    - name: Verify all final receipts and rehash downloaded assets
      env:
        RECEIPT_HASHES: ${{ steps.hashes.outputs.hashes }}
      run: |
        python3 scripts/ci_artifacts.py receipts
        target/acceptance/control/xtask acceptance summarize --plan target/acceptance/control/plan.json --receipts target/acceptance/receipts --out target/acceptance/release-summary.json
        target/acceptance/control/xtask acceptance verify-artifact --plan target/acceptance/control/plan.json --artifacts target/acceptance/receipts/build/artifacts
    - name: Require publication event and release profile
      run: python3 scripts/ci_artifacts.py require-publication
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |-
          target/acceptance/receipts/build/artifacts/math_talk_radar-x86_64-unknown-linux-musl
          target/acceptance/receipts/build/artifacts/math_talk_radar-x86_64-unknown-linux-musl.sha256
      name: Publish verified assets
    - name: Read back published bytes
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci_artifacts.py published-readback
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: release-acceptance-summary-${{ github.run_attempt }}
        path: |
          target/acceptance/release-summary.json
          target/acceptance/published-readback.json
        if-no-files-found: error
        retention-days: 30
      if: always()
